<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Загрузка — Morozhka Apps</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="brand">
        <img class="brand-mark" src="favicon.png" alt="">
        Morozhka <em>Apps</em>
      </a>
      <nav>
        <a href="catalog.html">Каталог</a>
        <a href="publish.html">Публикация</a>
        <a href="account.html">Профиль</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:640px;padding:40px 24px 64px">
    <div class="page-header" style="border:none">
      <h1>Загрузить файлы</h1>
      <p>Иконка и скриншоты — в облако. APK — через GitHub Releases.</p>
    </div>

    <form id="uploadForm">
      <div class="form-group">
        <label>Иконка приложения (PNG, до 2 МБ)</label>
        <div class="file-input-wrap">
          <span class="file-input-icon">🎃</span>
          <div class="file-input-text"><strong>Нажмите или перетащите</strong><br>PNG, JPG, WebP</div>
          <input type="file" accept="image/*" id="iconInput">
          <div class="file-input-name" id="iconName"></div>
        </div>
        <div class="hint" id="iconHint"></div>
      </div>

      <div class="form-group">
        <label>Скриншоты (до 5 штук, до 10 МБ каждый)</label>
        <div class="file-input-wrap">
          <span class="file-input-icon">🖼️</span>
          <div class="file-input-text"><strong>Нажмите или перетащите</strong><br>PNG, JPG, WebP</div>
          <input type="file" accept="image/*" multiple id="screensInput">
          <div class="file-input-name" id="screensName"></div>
        </div>
        <div class="hint" id="screensHint"></div>
      </div>

      <button type="submit" class="btn" style="width:100%">Загрузить в облако</button>
      <p id="status" style="margin-top:16px;text-align:center;font-size:13px"></p>
    </form>
  </main>

  <footer><div class="container">© 2026 MOROZHKA APPS</div></footer>

  <script type="module">
    import { storageUpload, storageUrl } from './js/api.js';
    import { getSession } from './js/session.js';

    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');
    const session = getSession();

    function bindName(inputId, nameId, multiple = false) {
      const input = document.getElementById(inputId);
      const name = document.getElementById(nameId);
      input?.addEventListener('change', () => {
        if (!input.files.length) { name.textContent = ''; return; }
        name.textContent = multiple
          ? Array.from(input.files).map(f => f.name).join(', ')
          : input.files[0].name;
      });
    }
    bindName('iconInput', 'iconName');
    bindName('screensInput', 'screensName', true);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!session) {
        status.textContent = 'Войдите, чтобы загружать файлы';
        status.style.color = 'var(--danger)';
        return;
      }
      const iconFile = document.getElementById('iconInput').files[0];
      const screenFiles = document.getElementById('screensInput').files;
      if (!iconFile && !screenFiles.length) {
        status.textContent = 'Выберите хотя бы один файл';
        status.style.color = 'var(--danger)';
        return;
      }
      status.textContent = 'Загрузка…';
      status.style.color = 'var(--muted)';

      const results = { icon_url: null, screenshots: [] };
      const userId = session.account_id;

      try {
        if (iconFile) {
          if (iconFile.size > 2 * 1024 * 1024) throw new Error('Иконка больше 2 МБ');
          const ext = iconFile.name.split('.').pop();
          const path = `${userId}/icon-${Date.now()}.${ext}`;
          await storageUpload('app-files', path, iconFile);
          results.icon_url = storageUrl('app-files', path);
          document.getElementById('iconHint').innerHTML = `✅ <a href="${results.icon_url}" target="_blank">Открыть</a>`;
          document.getElementById('iconHint').style.color = 'var(--success)';
        }
        for (const file of screenFiles) {
          if (file.size > 10 * 1024 * 1024) continue;
          const ext = file.name.split('.').pop();
          const path = `${userId}/screen-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
          await storageUpload('app-screenshots', path, file);
          results.screenshots.push(storageUrl('app-screenshots', path));
        }
        document.getElementById('screensHint').innerHTML = `✅ Загружено: ${results.screenshots.length} шт.`;
        document.getElementById('screensHint').style.color = 'var(--success)';
        status.innerHTML = `
          <div style="color:var(--success);margin-bottom:12px;font-weight:600">✅ Готово!</div>
          <div style="font-size:12px;color:var(--muted);word-break:break-all;text-align:left;background:var(--surface);padding:12px;border-radius:6px">
            ${results.icon_url ? `<div><strong>Иконка:</strong><br>${results.icon_url}</div>` : ''}
            ${results.screenshots.length ? `<div style="margin-top:8px"><strong>Скриншоты:</strong><br>${results.screenshots.join('<br>')}</div>` : ''}
          </div>
        `;
        status.style.color = 'var(--text)';
      } catch (err) {
        status.textContent = 'Ошибка: ' + err.message;
        status.style.color = 'var(--danger)';
      }
    });
  </script>
  <script type="module" src="js/nav.js?v=15"></script>
  <script type="module" src="js/halloween.js?v=15"></script>
</body>
</html>
