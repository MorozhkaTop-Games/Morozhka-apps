<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест — Morozhka Apps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="padding:40px;font-family:sans-serif;background:#1a1410;color:#f0e4d0">
  <h1>Тест запроса к Supabase</h1>
  <p id="log" style="font-size:14px;line-height:1.8;white-space:pre-wrap"></p>

  <script>
    const log = document.getElementById('log');
    function write(s, color) {
      log.innerHTML += '<div style="color:' + (color || '#f0e4d0') + '">' + s + '</div>';
    }

    const URL = 'https://tksbqddskldnaafevmnl.supabase.co/rest/v1/apps?select=id&limit=1';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrc2JxZGRza2xkbmFhZmV2bW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzcxNjEsImV4cCI6MjEwODM1MzE2MX0.7wiyoe1Jdx6Xvq6oMc9vplLcuFRUuyB28CmqcOF7Vbc';

    write('1. Старт');
    write('2. Делаю fetch через 3 секунды…');

    setTimeout(() => {
      write('3. fetch начался');

      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        write('❌ Таймаут 10 сек — fetch не вернулся', 'red');
      }, 10000);

      fetch(URL, {
        headers: {
          'apikey': KEY,
          'Authorization': 'Bearer ' + KEY,
        },
        signal: controller.signal,
      })
        .then(r => {
          clearTimeout(timer);
          write('✅ fetch вернулся, статус: ' + r.status, 'green');
          return r.json();
        })
        .then(data => {
          write('✅ Данные: ' + JSON.stringify(data).slice(0, 200), 'green');
        })
        .catch(err => {
          clearTimeout(timer);
          write('❌ Ошибка: ' + err.message, 'red');
        });
    }, 3000);
  </script>
</body>
</html>
