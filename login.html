<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Morozhka Apps</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="brand">
        <img class="brand-mark" src="favicon.png" alt="">
        Morozhka <em>Apps</em>
      </a>
      <nav>
        <a href="catalog.html">Каталог</a>
        <a href="publish.html">Публикация</a>
        <a href="account.html">Профиль</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:440px;padding:60px 24px 64px">
    <div class="login-wrap" style="margin:0">
      <h1>Вход</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" name="login" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%">Войти</button>
        <p id="status" style="margin-top:14px;font-size:13px;text-align:center"></p>
      </form>
      <p style="margin-top:20px;text-align:center;font-size:13px;color:var(--muted)">
        Нет аккаунта? <a href="signup.html">Зарегистрироваться</a>
      </p>
    </div>
  </main>

  <footer><div class="container">© 2026 MOROZHKA APPS</div></footer>

  <script type="module">
    import { dbRpc } from './js/api.js';
    import { saveSession } from './js/session.js';

    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      status.textContent = 'Вход…';
      status.style.color = 'var(--muted)';

      try {
        const data = await dbRpc('login_user', {
          p_login: fd.get('login'),
          p_password: fd.get('password'),
        });

        if (!data || data.error) {
          status.textContent = (data && data.error) || 'Ошибка входа';
          status.style.color = 'var(--danger)';
          return;
        }
        if (!data.account_id || !data.profile_id) {
          status.textContent = 'Сервер вернул неполный ответ';
          status.style.color = 'var(--danger)';
          return;
        }

        saveSession({
          account_id: data.account_id,
          profile_id: data.profile_id,
          display_name: data.display_name,
          slug: data.slug,
        });

        location.href = 'account.html';
      } catch (err) {
        status.textContent = err.message;
        status.style.color = 'var(--danger)';
      }
    });
  </script>
</body>
</html>
