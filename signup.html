<script type="module">
  import { dbRpc } from './js/api.js';
  import { saveSession } from './js/session.js';

  const form = document.getElementById('signupForm');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

    if (!turnstileToken) {
      status.textContent = 'Пройдите проверку капчи';
      status.style.color = 'var(--danger)';
      return;
    }

    status.textContent = 'Отправка…';
    status.style.color = 'var(--muted)';

    try {
      const data = await dbRpc('register_user', {
        p_login: fd.get('login'),
        p_password: fd.get('password'),
        p_display_name: fd.get('display_name'),
        p_slug: fd.get('slug'),
        p_turnstile_token: turnstileToken,
      });

      if (!data || data.error) {
        status.textContent = (data && data.error) || 'Ошибка регистрации';
        status.style.color = 'var(--danger)';
        if (window.turnstile) window.turnstile.reset();
        return;
      }

      if (!data.account_id || !data.profile_id) {
        status.textContent = 'Сервер вернул неполный ответ — проверь функцию register_user';
        status.style.color = 'var(--danger)';
        return;
      }

      saveSession({
        account_id: data.account_id,
        profile_id: data.profile_id,
        display_name: fd.get('display_name'),
        slug: fd.get('slug'),
      });

      status.textContent = 'Готово! Переходим…';
      status.style.color = 'var(--success)';
      setTimeout(() => location.href = 'account.html', 600);

    } catch (err) {
      status.textContent = 'Ошибка: ' + err.message;
      status.style.color = 'var(--danger)';
      if (window.turnstile) window.turnstile.reset();
    }
  });
</script>
