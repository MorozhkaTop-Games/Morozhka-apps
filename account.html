<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой профиль — Morozhka Apps</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta property="og:title" content="Morozhka Apps — каталог избранных игр для Android">
  <meta property="og:description" content="Без вирусов. Только проверенные приложения от самих авторов.">
  <meta property="og:image" content="https://morozhkatop-games.github.io/morozhka-apps/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://morozhkatop-games.github.io/morozhka-apps/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="brand"><span class="brand-mark">M</span>Morozhka <span>Apps</span></a>
      <nav>
        <a href="catalog.html">Каталог</a>
        <a href="publish.html">Публикация</a>
        <a href="account.html" class="active">Профиль</a>
      </nav>
    </div>
  </header>
  
  <div class="section" style="margin-top:32px">
  <div class="section-title">Смена пароля</div>
  <form id="passwordForm">
    <div class="form-group">
      <label>Текущий пароль</label>
      <input type="password" name="current" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Новый пароль</label>
        <input type="password" name="new1" required minlength="8">
      </div>
      <div class="form-group">
        <label>Повторите новый</label>
        <input type="password" name="new2" required minlength="8">
      </div>
    </div>
    <button type="submit" class="btn">Сменить пароль</button>
    <p id="passStatus" style="margin-top:10px;font-size:13px"></p>
  </form>
</div>

  <main class="container" id="content" style="padding-bottom:64px">
    <div class="empty">Загрузка…</div>
  </main>

  <footer><div class="container">© 2026 MOROZHKA APPS</div></footer>

  <script type="module" src="js/account.js"></script>
</body>
</html>
